<svg width="320" height="72" viewBox="0 0 320 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E0D4FF"/>
      <stop offset="100%" stop-color="#AD91FF"/>
    </linearGradient>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A4FFF"/>
      <stop offset="100%" stop-color="#5865F2"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Bot Avatar Badge Icon -->
  <g filter="url(#softGlow)">
    <rect x="6" y="8" width="56" height="56" rx="16" fill="url(#avatarBg)"/>
    <circle cx="26" cy="33" r="5" fill="#FFFFFF"/>
    <circle cx="42" cy="33" r="5" fill="#FFFFFF"/>
    <path d="M28 44 C31 47, 37 47, 40 44" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="56" cy="58" r="5" fill="#23A55A" stroke="#171822" stroke-width="2"/>
  </g>

  <!-- Brand Typography -->
  <text x="76" y="38" font-family="'Montserrat', 'Poppins', sans-serif" font-weight="900" font-size="24" fill="url(#shinGrad)" letter-spacing="1">SHIN BOT</text>
  <rect x="76" y="46" width="90" height="18" rx="4" fill="rgba(163, 230, 53, 0.15)" stroke="rgba(163, 230, 53, 0.35)" stroke-width="1"/>
  <text x="82" y="59" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="10" fill="#A3E635" letter-spacing="0.5">24/7 ONLINE</text>
</svg>
